# Raise the ceiling on locked memory for user services.
#
# A user unit cannot raise a hard rlimit above the one the systemd --user
# manager itself holds, because that needs CAP_SYS_RESOURCE. So LimitMEMLOCK in
# a user unit is silently ineffective unless the manager's own limit is raised
# here first.
#
# llavero uses this to call mlockall(), keeping decrypted private keys out of
# swap. Raising a ceiling allocates nothing by itself.
[Service]
LimitMEMLOCK=64M
